services:
  openclaw-gateway:
    environment:
      GH_TOKEN: ${GH_TOKEN}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    volumes:
      - ./:/host-openclaw
      - /var/run/docker.sock:/var/run/docker.sock

  openclaw-cli:
    environment:
      GH_TOKEN: ${GH_TOKEN}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    volumes:
      - ./:/host-openclaw
      - /var/run/docker.sock:/var/run/docker.sock
